name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The floor job. go.mod declares go 1.26, so this is the oldest
  # toolchain a consumer may bring, and the only one that proves the
  # generic-method file is genuinely excluded rather than merely
  # unused. It does not run gofmt: a 1.26 gofmt cannot parse that file
  # even though the build correctly skips it.
  floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache-dependency-path: go.mod
      - name: Build and test
        run: |
          go build ./...
          go test ./...
      - name: Vet
        run: go vet ./...

  # The current job. Compiles the generic-method spellings, owns the
  # format gate, and runs the fuzz smoke test.
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache-dependency-path: go.mod
      - name: Build and test
        run: |
          go build ./...
          go test ./...
      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            gofmt -l .
            echo "files are not gofmt'd"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Race
        run: go test -race ./...
      # Every fuzz target, each with its own budget. go test -fuzz takes
      # one target in one package per invocation, so this is a loop, and
      # cmd/fuzztape is that loop.
      - name: Fuzz smoke test
        run: go run ./cmd/fuzztape run -time 20s
